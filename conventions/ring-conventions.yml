pagination:
  style: cursor
  spec: "JSON:API cursor pagination"
  request_param: page[cursor]
  response_field: links.next
  page_size: fixed at 25 items
  notes: >-
    Cursor-based pagination is included for forward compatibility; at current subscription
    volumes most responses fit in a single page. Follow links.next to page forward.
idempotency:
  supported: true
  scope: webhook event delivery (consumer-side)
  key_field: meta.request_id
  guidance: >-
    Ring may deliver the same webhook event more than once due to retries or network issues.
    Webhook handlers MUST be idempotent — deduplicate deliveries using the meta.request_id
    field (or the event id). Each webhook request carries a unique request_id intended for use
    as an idempotency key. Ring does not document a request-side Idempotency-Key header for the
    read-only device/media endpoints (which are safe to retry).
rate_limiting:
  default: 100 requests per second (TPS) per partner client_id
  scope: applies per partner client_id across all endpoints
  headers:
  - X-RateLimit-Limit
  - X-RateLimit-Remaining
  - Retry-After
  on_exceed: HTTP 429 Too Many Requests; use exponential backoff starting at 1s and respect Retry-After
error_envelope:
