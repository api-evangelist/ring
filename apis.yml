aid: ring
name: Ring
description: >-
  Ring is an Amazon home-security company (doorbells, cameras, alarm systems, and the Ring
  Protect subscription) that in 2026 launched the Ring Developer platform and Ring Appstore.
  Third-party developers can build video-powered apps against the Ring Partner API — a REST
  API served from api.amazonvision.com (Amazon Vision API / AVA) that follows the JSON:API
  format and is secured with OAuth 2.0 one-way account linking. The API exposes device
  discovery, device status/capabilities/location/configurations, event history, WebRTC/WHEP
  live video, media clip and image downloads, subscription queries, and a webhook event
  surface (motion, button press, device online/offline, subscription changes). Ring also
  publishes a remote Model Context Protocol (MCP) server backed by an Amazon Bedrock
  Knowledge Base so AI coding assistants can query the documentation while building
  integrations, and publishes a HackerOne bug-bounty via a /.well-known/security.txt.
