apis:
- name: Ring Partner API
  description: >-
    The Ring Partner API (Amazon Vision API / AVA) lets certified Ring Appstore partners
    access Ring device data and media on behalf of consenting users: list and inspect devices,
    read status/capabilities/location/configurations, pull event history, stream live video
    over WebRTC/WHEP, download media clips and image snapshots, and query subscriptions. All
    endpoints follow the JSON:API format and require an OAuth 2.0 Bearer token obtained through
    one-way account linking; requests must be made server-to-server.
  humanURL: https://developer.amazon.com/docs/ring/api-documentation.html
  baseURL: https://api.amazonvision.com
